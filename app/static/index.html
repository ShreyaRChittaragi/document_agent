<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autonomous Document Agent</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --mut:#64707f; --pri:#1f3a5f; --ok:#1a7f4b; --warn:#b26a00; --bad:#b3261e; --line:#e1e6ed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212a; --ink:#e8edf3; --mut:#93a0b0; --pri:#6ea0e0; --line:#2b3440; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; color:var(--pri); }
  .sub { color:var(--mut); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  textarea { width:100%; min-height:110px; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--bg); color:var(--ink); resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  button, a.btn { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; }
  button.primary, a.btn.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
  @media (prefers-color-scheme: dark) { button.primary, a.btn.primary { color:#12161c; } }
  button:disabled { opacity:.5; cursor:wait; }
  h2 { font-size:15px; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  .pill { padding:2px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .done { color:var(--ok); } .revised, .recovered { color:var(--warn); } .failed { color:var(--bad); }
  ul { margin:0; padding-left:20px; }
  .err { color:var(--bad); } .hidden { display:none; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--pri); border-radius:50%; animation:s .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>Autonomous Document Agent</h1>
  <p class="sub">Describe a business document. The agent plans its own task list, executes it, self-reviews, and returns a Word file.</p>

  <div class="card">
    <textarea id="req" placeholder="e.g. Create a project proposal for a customer support chatbot with timeline and budget"></textarea>
    <div class="row">
      <button class="primary" id="go">Generate document</button>
      <button id="ex1">Standard example</button>
      <button id="ex2">Complex example</button>
      <span id="status" class="sub" style="margin:0"></span>
    </div>
  </div>

  <div id="err" class="card err hidden"></div>

  <div id="out" class="hidden">
    <div class="card">
      <h2 id="summary"></h2>
      <div class="row"><a id="dl" class="btn primary" href="#">Download .docx</a></div>
    </div>
    <div class="card"><h2>Agent task list</h2>
      <table><thead><tr><th>#</th><th>Task</th><th>Tool</th><th>Status</th></tr></thead><tbody id="plan"></tbody></table>
    </div>
    <div class="card"><h2>Assumptions the agent made</h2><ul id="assump"></ul></div>
    <div class="card"><h2>Self-review (reflection)</h2><div id="refl"></div></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const EX1 = "Create a project proposal for building a customer support chatbot for a retail company, including timeline and budget.";
const EX2 = "We need a launch plan ASAP but it must be cheap, also high quality; deadline unclear, team TBD. Figure it out.";
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$("ex1").onclick = () => $("req").value = EX1;
$("ex2").onclick = () => $("req").value = EX2;

$("go").onclick = async () => {
  const request = $("req").value.trim();
  $("err").classList.add("hidden"); $("out").classList.add("hidden");
  if (request.length < 10) { showErr("Please enter at least 10 characters."); return; }
  $("go").disabled = true;
  $("status").innerHTML = '<span class="spin"></span>Planning, executing, reviewing... (can take a minute)';
  try {
    const r = await fetch("/agent", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({request}) });
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail));
    render(d);
  } catch (e) { showErr(e.message); }
  finally { $("go").disabled = false; $("status").textContent = ""; }
};

function showErr(m) { $("err").textContent = m; $("err").classList.remove("hidden"); }

function render(d) {
  $("summary").textContent = d.summary;
  $("dl").href = d.document.download_url;
  $("dl").setAttribute("download", d.document.filename);
  $("plan").innerHTML = d.plan.map(t =>
    `<tr><td>${t.id}</td><td>${esc(t.title)}</td><td><code>${esc(t.tool)}</code></td><td><span class="pill ${t.status}" title="${esc(t.error || '')}">${t.status}</span></td></tr>`).join("");
  $("assump").innerHTML = d.assumptions.map(a => `<li>${esc(a)}</li>`).join("") || "<li>None</li>";
  const rf = d.reflection;
  $("refl").innerHTML = `<p>Score: <b>${rf.initial_score ?? "n/a"}/10 &rarr; ${rf.revision_score ?? rf.score ?? "n/a"}/10</b>${rf.reverted ? " (revisions were worse, original kept)" : ""} &middot; Revised tasks: ${[...new Set(rf.revised_task_ids)].join(", ") || "none"}</p>` +
    "<p><b>Found:</b></p><ul>" + rf.initial_issues.map(i => `<li>Task ${i.task_id}: ${esc(i.problem)}</li>`).join("") + "</ul>" +
    (rf.issues.length ? "<p><b>Still open:</b></p><ul>" + rf.issues.map(i => `<li>Task ${i.task_id}: ${esc(i.problem)}</li>`).join("") + "</ul>" : "<p><b>Still open:</b> nothing</p>");
  $("out").classList.remove("hidden");
}
</script>
</body>
</html>
